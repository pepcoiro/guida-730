<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Guida 730: organizza i dati del CSV Revolut da verificare per la dichiarazione.">
  <meta name="theme-color" content="#171717">
  <title>Guida 730</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<div class="shell">
  <header class="header"><h1 class="brand">Guida 730</h1></header>
  <main>
    <section class="panel upload-panel" id="upload-panel">
      <h2>Carica il CSV Revolut</h2>
      <label class="dropzone" id="dropzone" for="file-input">
        <strong>Trascina qui il CSV oppure clicca per sceglierlo</strong>
        <input id="file-input" type="file" accept=".csv,text/csv">
      </label>
      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    </section>
    <section id="report" hidden>
      <div class="report-header">
        <h2 id="report-title">Quadri fiscali</h2>
        <button id="new-analysis" class="button quiet" type="button">Nuovo file</button>
      </div>
      <section class="panel"><div id="tax-results" class="tax-results"></div></section>
    </section>
  </main>
</div>
</body>
</html>
